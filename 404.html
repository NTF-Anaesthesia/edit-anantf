<title>Opening the page editor…</title>
<script>
  // edit.anantf.com/<page> → anantf.com/edit.html?page=/<page>
  (function () {
    var p = location.pathname + location.search + location.hash;
    if (/^\/(index\.html)?$/.test(location.pathname) && !location.search && !location.hash) p = '/';
    location.replace('https://anantf.com/edit.html?page=' + encodeURIComponent(p));
  })();
</script>
<meta http-equiv="refresh" content="2;url=https://anantf.com/edit.html">
